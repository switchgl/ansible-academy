---
- name: Render a template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_name: academy
    app_port: 8080
  tasks:
    - name: Ensure directory
      ansible.builtin.file:
        path: /tmp/ansible-academy
        state: directory
    - name: Render config
      ansible.builtin.template:
        src: app.conf.j2
        dest: /tmp/ansible-academy/app.conf
        mode: "0644"
