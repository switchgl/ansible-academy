---
- name: Block with rescue
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Try and recover
      block:
        - name: Create directory
          ansible.builtin.file:
            path: /tmp/ansible-academy/block
            state: directory
        - name: Force a failure
          ansible.builtin.fail:
            msg: "Simulated failure"
      rescue:
        - name: Record failure
          ansible.builtin.copy:
            dest: /tmp/ansible-academy/failed.txt
            content: "recovered\n"
      always:
        - name: Always log
          ansible.builtin.debug:
            msg: "Block finished"
